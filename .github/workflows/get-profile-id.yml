name: Get Marketplace profile ID

on: workflow_dispatch

jobs:
  profile:
    runs-on: ubuntu-latest
    environment: github-marketplace
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Print encrypted profile ID
        env:
          KEY: ${{ secrets.PROFILE_KEY }}
        run: |
          ID=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id -o tsv)
          echo "::add-mask::$ID"
          printf '%s' "$ID" | openssl enc -aes-256-cbc -pbkdf2 -salt -a -A -pass env:KEY
          echo